<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#fff">
<!-- Streamlit 本体の代わりに、コンポーネントとメッセージをやり取りするテスト用の親ページ -->
<iframe id="f" src="/reversi/frontend/index.html" style="border:0;width:500px;height:10px"></iframe>
<script>
  window.__msgs = [];
  window.addEventListener('message', function (e) {
    if (e.data && e.data.isStreamlitMessage) {
      window.__msgs.push(e.data);
      // Streamlit 本体と同じく、通知された高さにフレームを合わせる
      if (e.data.type === 'streamlit:setFrameHeight') {
        document.getElementById('f').style.height = e.data.height + 'px';
      }
    }
  });
  window.sendRender = function (args) {
    document.getElementById('f').contentWindow.postMessage(
      { type: 'streamlit:render', args: args, disabled: false,
        theme: { textColor: '#31333F', backgroundColor: '#ffffff' } }, '*');
  };
</script>
</body></html>
